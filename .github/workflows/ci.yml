name: CI Pipeline

on:
  pull_request:
    branches: [develop, main]

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-dummy-secret-key-not-for-production
      DATABASE_NAME: masar_db
      DATABASE_USER: postgres
      DATABASE_PASSWORD: ci-postgres-password
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
    # A throwaway Postgres container that lives only for this job
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: masar_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        # Don't start the steps until Postgres is actually accepting connections
        options: >-
          --health-cmd "pg_isready -U postgres -d masar_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Check if backend exists
        id: check
        run: |
          if [ -f backend/requirements.txt ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        if: steps.check.outputs.exists == 'true'
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run Django checks
        if: steps.check.outputs.exists == 'true'
        working-directory: backend
        run: python manage.py check

      - name: Check for missing migrations
        if: steps.check.outputs.exists == 'true'
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

      # Django builds its own empty test database (test_masar_db) and tests create
      # their own data, so tests do NOT depend on the seed script.
      - name: Run backend tests
        if: steps.check.outputs.exists == 'true'
        working-directory: backend
        run: python manage.py test

      # Separate smoke test: proves migrate + seed_data still work together on an
      # empty database, so a model change can't silently break the demo seed.
      - name: Smoke-test migrations and seed command
        if: steps.check.outputs.exists == 'true'
        working-directory: backend
        run: |
          python manage.py migrate --noinput
          python manage.py seed_data

      - name: No backend yet
        if: steps.check.outputs.exists == 'false'
        run: echo "No backend/requirements.txt found yet — skipping backend checks."

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check if frontend exists
        id: check
        run: |
          if [ -f frontend/package.json ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Node
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: npm install

      - name: Build frontend
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: npm run build

      - name: No frontend yet
        if: steps.check.outputs.exists == 'false'
        run: echo "No frontend/package.json found yet — skipping frontend checks."